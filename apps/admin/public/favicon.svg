<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2744CC"/>
      <stop offset="100%" stop-color="#18B89A"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>
  <!-- Subtle top-left shine -->
  <rect width="32" height="32" rx="7.5" fill="url(#shine)"/>

  <!-- Atom mark -->
  <g stroke="rgba(255,255,255,0.93)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Axis lines -->
    <line x1="5" y1="16" x2="27" y2="16" stroke-width="1.15"/>
    <line x1="16" y1="5" x2="16" y2="27" stroke-width="1.15"/>
    <!-- Orbital ellipses -->
    <ellipse cx="16" cy="16" rx="10" ry="4.6" fill="none" stroke-width="1.15" transform="rotate(-40 16 16)"/>
    <ellipse cx="16" cy="16" rx="10" ry="4.6" fill="none" stroke-width="1.15" transform="rotate(40 16 16)"/>
    <!-- Center ring -->
    <circle cx="16" cy="16" r="2.6" fill="none" stroke-width="1.15"/>
  </g>

  <!-- Axis endpoint dots -->
  <circle cx="5"  cy="16" r="1.55" fill="rgba(255,255,255,0.93)"/>
  <circle cx="27" cy="16" r="1.55" fill="rgba(255,255,255,0.93)"/>
  <circle cx="16" cy="5"  r="1.55" fill="rgba(255,255,255,0.93)"/>
  <circle cx="16" cy="27" r="1.55" fill="rgba(255,255,255,0.93)"/>
</svg>
